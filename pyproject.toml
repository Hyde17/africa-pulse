[project]
name = "africa-pulse"
version = "0.1.0"
description = "Open data ingestion and analytics for African cities."
readme = "README.md"
authors = [
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
]


[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
